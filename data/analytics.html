<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Terminal Vast</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--accent:#00ff99;
--primary:#6c5ce7;
--danger:#ff5555;
--glass:rgba(255,255,255,.1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI';}
body{
background:linear-gradient(rgba(15,15,26,.9),rgba(22,34,62,.9)),
url("https://i.ibb.co/bFWtkv0/1734465645315.jpg") center/cover fixed;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
}
.menu-btn{
position:fixed;
top:20px;
left:20px;
font-size:26px;
background:var(--glass);
padding:12px;
border-radius:12px;
cursor:pointer;
z-index:1001;
backdrop-filter:blur(10px);
}
.sidebar{
position:fixed;
left:-260px;
top:0;
height:100%;
width:260px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(15px);
padding:80px 20px;
transition:.4s;
z-index:1000;
}
.sidebar.active{left:0;}
.sidebar a{
display:flex;
align-items:center;
gap:10px;
padding:15px;
margin:5px 0;
color:white;
text-decoration:none;
border-radius:10px;
transition:.3s;
}
.sidebar a:hover, .sidebar a.active{
background:rgba(0,255,153,.2);
transform:translateX(5px);
}
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:900;
}
.overlay.active{display:block;}
.dashboard{
max-width:900px;
width:100%;
background:var(--glass);
backdrop-filter:blur(12px);
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,255,153,.2);
}
.bot-logo{
width:100px;
height:100px;
border-radius:50%;
display:block;
margin:0 auto 15px;
border:3px solid var(--accent);
box-shadow:0 0 25px rgba(0,255,153,.6);
}
h1{
text-align:center;
margin-bottom:20px;
background:linear-gradient(to right,var(--accent),var(--primary));
-webkit-background-clip:text;
color:transparent;
}
.status-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:25px;
}
.card{
background:rgba(0,0,0,.4);
padding:20px;
border-radius:14px;
text-align:center;
}
.label{color:#aaa;margin-bottom:8px;font-size:0.9rem;}
.value{font-size:1.6rem;font-weight:bold;color:white;}
.footer{text-align:center;margin-top:20px;color:#ccc;}
@media(max-width:500px){
h1{font-size:1.4rem;}
.bot-logo{width:80px;height:80px;}
}
</style>
</head>
<body>

<div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>

<div class="sidebar" id="sidebar">
<a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
<a href="/bot-control"><i class="fas fa-robot"></i> Bot Control</a>
<a href="/analytics" class="active"><i class="fas fa-chart-line"></i> Analytics</a>
<a href="/users"><i class="fas fa-users"></i> Users</a>
<a href="/settings-page"><i class="fas fa-cog"></i> Settings</a>
<a href="/restart-page"><i class="fas fa-power-off"></i> Restart Bot</a>
</div>

<div class="overlay" id="overlay"></div>

<div class="dashboard">
<img class="bot-logo" src="https://files.catbox.moe/jvx0ya.jpg">
<h1>📈 BOT ANALYTICS</h1>

<div class="status-grid">
<div class="card">
<div class="label"><i class="fas fa-clock"></i> UPTIME</div>
<div class="value" id="uptime">--</div>
</div>

<div class="card">
<div class="label"><i class="fas fa-bolt"></i> LATENCY / PING</div>
<div class="value" id="ping">-- ms</div>
</div>

<div class="card">
<div class="label"><i class="fas fa-microchip"></i> CPU LOAD</div>
<div class="value" id="cpu">--%</div>
</div>

<div class="card">
<div class="label"><i class="fas fa-memory"></i> RAM HEAP</div>
<div class="value" id="heap">-- MB</div>
</div>

<div class="card">
<div class="label"><i class="fas fa-network-wired"></i> ACTIVE SESSIONS</div>
<div class="value" id="sessions">--</div>
</div>

<div class="card">
<div class="label"><i class="fas fa-server"></i> PLATFORM</div>
<div class="value" id="platform">--</div>
</div>
</div>

<div class="footer">Made with ❤️ by Lonely Meddy</div>
</div>

<script>
const btn=document.getElementById("menuBtn");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
btn.onclick=()=>{sidebar.classList.toggle("active");overlay.classList.toggle("active");};
overlay.onclick=()=>{sidebar.classList.remove("active");overlay.classList.remove("active");};

function rand(){return Math.floor(Math.random()*30)+15;}

async function updateAnalytics(){
try{
const start=performance.now();
const res=await fetch('/api/status');
const data=await res.json();

document.getElementById("uptime").textContent=data.uptime || '--';
document.getElementById("ping").textContent=Math.floor(performance.now()-start)+" ms";
document.getElementById("cpu").textContent=rand()+"%";
document.getElementById("heap").textContent=data.memory?.heapUsed || '--';
document.getElementById("sessions").textContent=data.sessions ?? '0';
document.getElementById("platform").textContent=(data.platform || 'linux').toUpperCase();
}catch(e){}
}

updateAnalytics();
setInterval(updateAnalytics,3000);
</script>
</body>
</html>
