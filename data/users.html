<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — Terminal Vast</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--accent:#00ff99;
--primary:#6c5ce7;
--danger:#ff5555;
--glass:rgba(255,255,255,.1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI';}
body{
background:linear-gradient(rgba(15,15,26,.9),rgba(22,34,62,.9)),
url("https://i.ibb.co/bFWtkv0/1734465645315.jpg") center/cover fixed;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
}
.menu-btn{
position:fixed;
top:20px;
left:20px;
font-size:26px;
background:var(--glass);
padding:12px;
border-radius:12px;
cursor:pointer;
z-index:1001;
backdrop-filter:blur(10px);
}
.sidebar{
position:fixed;
left:-260px;
top:0;
height:100%;
width:260px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(15px);
padding:80px 20px;
transition:.4s;
z-index:1000;
}
.sidebar.active{left:0;}
.sidebar a{
display:flex;
align-items:center;
gap:10px;
padding:15px;
margin:5px 0;
color:white;
text-decoration:none;
border-radius:10px;
transition:.3s;
}
.sidebar a:hover, .sidebar a.active{
background:rgba(0,255,153,.2);
transform:translateX(5px);
}
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:900;
}
.overlay.active{display:block;}
.dashboard{
max-width:900px;
width:100%;
background:var(--glass);
backdrop-filter:blur(12px);
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,255,153,.2);
}
.bot-logo{
width:100px;
height:100px;
border-radius:50%;
display:block;
margin:0 auto 15px;
border:3px solid var(--accent);
box-shadow:0 0 25px rgba(0,255,153,.6);
}
h1{
text-align:center;
margin-bottom:20px;
background:linear-gradient(to right,var(--accent),var(--primary));
-webkit-background-clip:text;
color:transparent;
}
.section-card{
background:rgba(0,0,0,.4);
padding:20px;
border-radius:14px;
margin-bottom:20px;
}
.section-title{
font-size:1.2rem;
font-weight:bold;
margin-bottom:15px;
color:var(--accent);
display:flex;
align-items:center;
gap:10px;
}
.form-group{margin-bottom:15px;}
label{display:block;color:#aaa;margin-bottom:6px;font-size:0.9rem;}
input[type="text"], input[type="tel"]{
width:100%;
padding:12px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
border-radius:8px;
color:white;
font-size:1rem;
outline:none;
}
input:focus{border-color:var(--accent);}
.btn{
padding:10px 20px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
font-size:0.9rem;
display:inline-flex;
align-items:center;
gap:8px;
}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:#00cc7a;}
.btn-danger{background:var(--danger);color:white;}
.btn-danger:hover{background:#e04343;}
.user-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:rgba(255,255,255,0.05);
border-radius:8px;
margin-bottom:10px;
}
.footer{text-align:center;margin-top:20px;color:#ccc;}
@media(max-width:500px){
h1{font-size:1.4rem;}
.bot-logo{width:80px;height:80px;}
}
</style>
</head>
<body>

<div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>

<div class="sidebar" id="sidebar">
<a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
<a href="/bot-control"><i class="fas fa-robot"></i> Bot Control</a>
<a href="/analytics"><i class="fas fa-chart-line"></i> Analytics</a>
<a href="/users" class="active"><i class="fas fa-users"></i> Users</a>
<a href="/settings-page"><i class="fas fa-cog"></i> Settings</a>
<a href="/restart-page"><i class="fas fa-power-off"></i> Restart Bot</a>
</div>

<div class="overlay" id="overlay"></div>

<div class="dashboard">
<img class="bot-logo" src="https://files.catbox.moe/jvx0ya.jpg">
<h1>👥 USERS & SESSIONS</h1>

<div class="section-card">
<div class="section-title"><i class="fas fa-user-shield"></i> Sudo Users</div>
<div class="form-group" style="display:flex;gap:10px;">
<input type="tel" id="sudoPhone" placeholder="Enter phone number e.g. 256702662846">
<button class="btn btn-primary" onclick="addSudo()"><i class="fas fa-plus"></i> Add Sudo</button>
</div>
<div id="sudoList">Loading sudo users...</div>
</div>

<div class="section-card">
<div class="section-title"><i class="fas fa-wifi"></i> Active Web Pairing Sessions</div>
<div id="sessionList">Loading web sessions...</div>
</div>

<div class="footer">Made with ❤️ by Lonely Meddy</div>
</div>

<script>
const btn=document.getElementById("menuBtn");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
btn.onclick=()=>{sidebar.classList.toggle("active");overlay.classList.toggle("active");};
overlay.onclick=()=>{sidebar.classList.remove("active");overlay.classList.remove("active");};

async function loadUsers(){
try{
const res = await fetch('/api/users');
const data = await res.json();

// Sudo users
const sudoContainer = document.getElementById('sudoList');
if(data.sudo && data.sudo.length > 0){
sudoContainer.innerHTML = data.sudo.map(num => `
<div class="user-item">
<span><i class="fas fa-user-tag" style="color:var(--accent);"></i> ${num}</span>
<button class="btn btn-danger" onclick="removeSudo('${num}')"><i class="fas fa-trash"></i> Remove</button>
</div>
`).join('');
}else{
sudoContainer.innerHTML = '<p style="color:#aaa;">No sudo users added yet.</p>';
}

// Active sessions
const sessionContainer = document.getElementById('sessionList');
if(data.sessions && data.sessions.length > 0){
sessionContainer.innerHTML = data.sessions.map(s => `
<div class="user-item">
<span><i class="fas fa-phone" style="color:var(--accent);"></i> ${s.phone || 'Web Pairing User'}</span>
<span class="btn btn-primary" style="padding:4px 10px;font-size:0.8rem;">${(s.status||'connected').toUpperCase()}</span>
</div>
`).join('');
}else{
sessionContainer.innerHTML = '<p style="color:#aaa;">No web sessions currently connected.</p>';
}

}catch(e){ console.error(e); }
}

async function addSudo(){
const phone = document.getElementById('sudoPhone').value.trim();
if(!phone){ alert('Please enter phone number'); return; }
try{
const res = await fetch('/api/users/sudo', {
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({ action:'add', phone })
});
const data = await res.json();
alert(data.message || 'Updated');
document.getElementById('sudoPhone').value = '';
loadUsers();
}catch(e){ alert('Error adding sudo user'); }
}

async function removeSudo(phone){
if(!confirm('Remove sudo access for ' + phone + '?')) return;
try{
const res = await fetch('/api/users/sudo', {
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({ action:'remove', phone })
});
const data = await res.json();
alert(data.message || 'Removed');
loadUsers();
}catch(e){ alert('Error removing sudo user'); }
}

loadUsers();
</script>
</body>
</html>
